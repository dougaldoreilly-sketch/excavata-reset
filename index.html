<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Reset your Excavata password</title>
  <style>
    :root { --orange: #E86B30; --bg: #1a1a1a; --card: #242424; --text: #f0f0f0; --muted: #9a9a9a; --err: #ff6b6b; --ok: #4caf82; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .card { background: var(--card); border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
    input[type=password] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1c1c1c; color: var(--text); font-size: 15px; }
    input:focus { outline: none; border-color: var(--orange); }
    button { width: 100%; margin-top: 24px; padding: 13px; border: none; border-radius: 8px; background: var(--orange); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">Choose a new password for your Excavata account.</p>

    <div id="form-wrap" class="hidden">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password" />
      <button id="submit" disabled>Update password</button>
    </div>

    <div id="status" class="msg">Verifying your reset link…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://erdvfhntklgkkgfqgcpv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9fg_ZRJ8gA-7xH1e8dupkQ_vMN_LPpk';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const statusEl = document.getElementById('status');
    const formWrap = document.getElementById('form-wrap');
    const submitBtn = document.getElementById('submit');
    const pw = document.getElementById('pw');
    const pw2 = document.getElementById('pw2');

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = 'msg' + (kind ? ' ' + kind : '');
    }

    let recoveryReady = false;
    let resolveTimer = null;
    function enableForm() {
      if (recoveryReady) return;
      recoveryReady = true;
      if (resolveTimer) clearTimeout(resolveTimer);
      formWrap.classList.remove('hidden');
      setStatus('', '');
    }

    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') enableForm();
    });

    async function verifyRecovery() {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type') || 'recovery';

      if (tokenHash) {
        const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type });
        if (!error) { enableForm(); return; }
        setStatus('This reset link has expired or has already been used. Request a new one from the app.', 'err');
        return;
      }

      resolveTimer = setTimeout(async () => {
        if (recoveryReady) return;
        const { data } = await client.auth.getSession();
        if (data && data.session) { enableForm(); return; }
        if (params.has('code')) {
          setStatus('This reset link can’t be completed in the browser. Request a new password-reset email from the app.', 'err');
        } else {
          setStatus('This reset link is missing its token. Request a new password-reset email from the app.', 'err');
        }
      }, 4000);
    }
    window.addEventListener('load', verifyRecovery);

    function validate() {
      const a = pw.value, b = pw2.value;
      submitBtn.disabled = !(a.length >= 8 && a === b);
    }
    pw.addEventListener('input', validate);
    pw2.addEventListener('input', validate);

    submitBtn.addEventListener('click', async () => {
      if (pw.value.length < 8) { setStatus('Password must be at least 8 characters.', 'err'); return; }
      if (pw.value !== pw2.value) { setStatus('Passwords do not match.', 'err'); return; }
      submitBtn.disabled = true;
      setStatus('Updating…', '');
      const { error } = await client.auth.updateUser({ password: pw.value });
      if (error) {
        setStatus(error.message || 'Could not update password. The link may have expired — request a new one.', 'err');
        submitBtn.disabled = false;
        return;
      }
      formWrap.classList.add('hidden');
      setStatus('Password updated. You can now return to the Excavata app and sign in with your new password.', 'ok');
    });
  </script>
</body>
</html>
